<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Skin Aesthetics">
  <defs>
    <style>
      .sa-mark {
        font-family: 'Cormorant Garamond', 'Cormorant', Georgia, serif;
        font-weight: 500;
        font-style: normal;
        fill: #5C3A1E;
      }
      .sa-wordmark {
        font-family: 'Cormorant Garamond', 'Cormorant', Georgia, serif;
        font-weight: 500;
        letter-spacing: 0.18em;
        fill: #5C3A1E;
      }
    </style>
  </defs>

  <!-- S -->
  <text x="125" y="220" class="sa-mark" font-size="240" text-anchor="middle">S</text>

  <!-- A -->
  <text x="275" y="220" class="sa-mark" font-size="240" text-anchor="middle">A</text>

  <!-- Flourish: cursive horizontal swoosh under the S and A, with a tail rising into the A -->
  <path
    d="M 60 215
       C 100 235, 150 245, 200 215
       C 250 185, 305 195, 345 220
       C 320 215, 295 220, 280 230
       C 295 222, 312 218, 330 220"
    fill="none"
    stroke="#5C3A1E"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Wordmark -->
  <text x="200" y="295" class="sa-wordmark" font-size="34" text-anchor="middle">SKIN AESTHETICS</text>
</svg>
